version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # This is a Dart pub workspace (see the root pubspec.yaml). Dependabot's
  # pub updater can only run at the workspace root; per-package entries under
  # packages/ fail with "Only apply dependency_services to the root of the
  # workspace". The root entry resolves and updates the whole workspace.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
