name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run workspace tests
        run: |
          for package in packages/agent_loop_core packages/agent_loop packages/agent_loop_cli; do
            echo "Running tests in $package"
            (
              cd "$package"
              dart test
            )
          done

      - name: Analyze workspace
        run: dart analyze

      - name: Smoke test CLI
        run: dart run packages/agent_loop_cli/bin/agent_loop.dart "what time is it?"
