name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run workspace tests
        run: |
          for package in packages/agent_loop_core packages/agent_loop packages/agent_loop_cli; do
            echo "Running tests in $package"
            (
              cd "$package"
              dart test
            )
          done

      - name: Analyze workspace
        run: dart analyze

      - name: Smoke test CLI
        run: dart run packages/agent_loop_cli/bin/agent_loop.dart "what time is it?"
